<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Roda antes da primeira pintura: se vamos voltar para a sala (F5), esconde a tela de entrada para ela não piscar -->
  <script>
    try {
      var s = JSON.parse(sessionStorage.getItem('session') || 'null');
      var r = (new URLSearchParams(location.search).get('room') || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (s && s.name && s.room === r) document.documentElement.classList.add('rejoining');
    } catch (e) {}
  </script>
  <title>Telão</title>
  <meta name="description" content="Compartilhe sua tela com os amigos, direto no navegador." />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Aparece no lugar da tela de entrada enquanto volta para a sala -->
  <div id="rejoin" class="rejoin" role="status">
    <i class="ti ti-loader-2 spin"></i>
    <span>Voltando para a sala…</span>
  </div>

  <!-- Tela de entrada -->
  <main id="lobby" class="lobby">
    <form id="joinForm" class="card">
      <div class="brand">
        <span class="logo"><i class="ti ti-device-desktop-share"></i></span>
        <h1>Telão</h1>
      </div>
      <p id="invited" class="invited" hidden><i class="ti ti-mail-opened"></i><span></span></p>
      <p class="tagline">Mostre sua tela para os amigos e veja a deles, direto no navegador.</p>

      <label class="field">
        <span>Seu nome</span>
        <div class="input">
          <i class="ti ti-user"></i>
          <input id="nameInput" maxlength="24" placeholder="Como te chamam?" required autocomplete="off" />
        </div>
      </label>
      <label class="field">
        <span>Código da sala</span>
        <div class="input">
          <i class="ti ti-hash"></i>
          <input id="roomInput" maxlength="40" placeholder="ex.: noite-de-jogo" required autocomplete="off" spellcheck="false" />
          <button type="button" id="shuffleRoom" class="icon-btn" title="Gerar outro código" aria-label="Gerar outro código"><i class="ti ti-dice-3"></i></button>
        </div>
      </label>

      <button class="btn primary big" type="submit"><i class="ti ti-door-enter"></i><span>Entrar na sala</span></button>
      <p id="lobbyError" class="error" hidden></p>

      <ul class="perks">
        <li><i class="ti ti-screen-share"></i>Tela e áudio</li>
        <li><i class="ti ti-users"></i>Até 8 pessoas</li>
        <li><i class="ti ti-bolt"></i>Sem cadastro</li>
      </ul>
    </form>
  </main>

  <!-- Sala -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="room-title">
        <span class="muted small">SALA</span>
        <strong id="roomName"></strong>
        <button id="copyLink" class="btn small"><i class="ti ti-copy"></i><span>Copiar convite</span></button>
      </div>
      <div class="muted small section">NA SALA — <span id="count">1</span></div>
      <ul id="members" class="members"></ul>    </aside>

    <section class="stage">
      <div id="grid" class="grid">
        <div id="empty" class="empty">
          <p>Ninguém está compartilhando a tela.</p>
          <p class="muted">Clique em <b>Compartilhar tela</b> para começar.</p>
        </div>
      </div>

      <footer class="controls">
        <label class="quality" title="Qualidade da transmissão (pode mudar durante o compartilhamento)">
          <i class="ti ti-adjustments-horizontal"></i>
          <span>Qualidade</span>
          <select id="quality">
            <option value="720p30">720p · 30fps</option>
            <option value="1080p30" selected>1080p · 30fps</option>
            <option value="1080p60">1080p · 60fps</option>
          </select>
        </label>
        <button id="micBtn" class="btn" title="Ligar/desligar microfone"><i class="ti ti-microphone-off"></i><span>Microfone</span></button>
        <button id="shareBtn" class="btn primary"><i class="ti ti-screen-share"></i><span>Compartilhar tela</span></button>
        <button id="switchBtn" class="btn" hidden title="Escolher outra tela ou janela sem parar a transmissão"><i class="ti ti-arrows-exchange"></i><span>Trocar tela</span></button>
        <button id="leaveBtn" class="btn danger"><i class="ti ti-logout"></i><span>Sair</span></button>
      </footer>
    </section>
  </div>

  <!-- Confirmação de saída -->
  <div id="leaveModal" class="modal" hidden>
    <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="leaveTitle" aria-describedby="leaveText">
      <span class="modal-icon"><i class="ti ti-logout"></i></span>
      <h2 id="leaveTitle">Sair da sala?</h2>
      <p id="leaveText" class="muted"></p>
      <div class="modal-actions">
        <button id="leaveCancel" type="button" class="btn">Ficar</button>
        <button id="leaveConfirm" type="button" class="btn danger"><i class="ti ti-logout"></i><span>Sair</span></button>
      </div>
    </div>
  </div>

  <!-- elementos de mídia sem vídeo (ex.: só microfone) ficam aqui -->
  <div id="sink" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
